name: MyAI Bot CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - name: pnpm telepítés
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Függőségek
        run: pnpm install --frozen-lockfile

      - name: Szintaxis-ellenőrzés
        run: node --check src/index.js && node --check src/core/engine.js && node --check src/server/http.js

      - name: Selftest (motor nélkül is futnia kell)
        run: pnpm test
        env:
          MYAI_DEBUG: '0'
