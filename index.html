<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<title>MyAI Bot — 3D Multi-Model UI</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0a0e1a; color:#e8ecf5; font-family:'Segoe UI',system-ui,sans-serif; overflow:hidden; }
  #bg3d { position:fixed; inset:0; z-index:0; }
  .app { position:relative; z-index:1; display:flex; flex-direction:column; height:100vh; }
  header { padding:14px 24px; display:flex; align-items:center; gap:12px; background:rgba(10,14,26,.72); backdrop-filter:blur(8px); border-bottom:1px solid rgba(120,140,255,.18); }
  header h1 { font-size:17px; font-weight:600; letter-spacing:.5px; }
  header .dot { width:9px; height:9px; border-radius:50%; background:#22d3aa; box-shadow:0 0 10px #22d3aa; }
  #status { font-size:12px; color:#8fa3c8; }
  .spacer { flex:1; }
  #chat { flex:1; overflow-y:auto; padding:18px 24px; display:flex; flex-direction:column; gap:14px; }
  .row { display:flex; flex-direction:column; gap:8px; }
  .msg { max-width:72%; padding:10px 14px; border-radius:14px; line-height:1.5; font-size:14px; white-space:pre-wrap; }
  .user { align-self:flex-end; background:linear-gradient(135deg,#2563eb,#7c3aed); border-radius:14px 14px 4px 14px; }
  .bot { align-self:flex-start; background:rgba(30,38,60,.85); border:1px solid rgba(120,140,255,.18); border-radius:14px 14px 14px 4px; }
  .tag { font-size:11px; color:#7c8db5; margin-bottom:2px; }
  .composer { display:flex; gap:10px; padding:14px 24px; background:rgba(10,14,26,.72); backdrop-filter:blur(8px); border-top:1px solid rgba(120,140,255,.18); }
  #input { flex:1; background:rgba(30,38,60,.9); border:1px solid rgba(120,140,255,.25); color:#e8ecf5; padding:12px 16px; border-radius:12px; font-size:14px; outline:none; }
  #input:focus { border-color:#7c3aed; box-shadow:0 0 0 3px rgba(124,58,237,.25); }
  button { background:linear-gradient(135deg,#2563eb,#7c3aed); color:#fff; border:none; padding:12px 22px; border-radius:12px; font-size:14px; cursor:pointer; transition:.2s; }
  button:hover { transform:translateY(-1px); box-shadow:0 4px 16px rgba(124,58,237,.4); }
  button:disabled { opacity:.5; cursor:default; transform:none; }
</style>
</head>
<body>
<div id="bg3d"></div>
<div class="app">
  <header>
    <div class="dot"></div>
    <h1>MyAI Bot</h1>
    <span id="status">kapcsolódás…</span>
    <div class="spacer"></div>
    <span style="font-size:12px;color:#8fa3c8">Multi-model · párhuzamos válaszok</span>
  </header>
  <div id="chat"></div>
  <div class="composer">
    <input id="input" placeholder="Írj valamit… (Enter = küldés)" autocomplete="off">
    <button id="send">Küldés</button>
  </div>
</div>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
<script type="module" src="/ui/app.js"></script>
</body>
</html>
